[package]
name = "tdxcardio"
version = "0.2.0"
edition = "2024"
description = "Standalone heartbeat watchdog for TouchDesigner projects (TDX Launcher Ultra compatible)"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tdxcardio-core = { path = "../core" }
tray-icon = { version = "0.26.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"
