name: Release builds

# Builds the Windows exe and a universal macOS app and attaches them, with
# Cardio.tox, to a GitHub release. Runs when a release is published, or by
# hand ("Run workflow") to (re)build the assets of an existing release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (the code is built from the branch you run this on)
        required: true
        default: v0.1.0

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Build universal TDXCardio.app
        run: bash packaging/macos/make_app.sh
      - name: Attach to release
        run: gh release upload "$TAG" dist/TDXCardio-macos.zip --clobber

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build TDXCardio.exe
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/tdxcardio.exe dist/TDXCardio.exe
          cp ../release/Cardio.tox dist/Cardio.tox
      - name: Attach to release
        run: gh release upload "$TAG" dist/TDXCardio.exe dist/Cardio.tox --clobber
