[package]
name = "tdxcardio-core"
version = "0.2.1"
edition = "2021"
description = "TDXCardio's watchdog engine: wire protocol, project rules, bus and per-project watcher"
license = "MIT"

[features]
default = ["smtp"]
# The built-in SMTP sender. An app with its own mail transport turns this off
# and passes a notifier to the watcher instead.
smtp = ["dep:lettre"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "ring"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
